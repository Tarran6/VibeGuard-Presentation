<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeGuard AI | Web3 Security Apex</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Inter:wght@300;800&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
    <style>
        body { background-color: #010103; color: #f0f0f0; font-family: 'Inter', sans-serif; overflow-x: hidden; scroll-behavior: smooth; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .gradient-text { background: linear-gradient(135deg, #00f2fe 10%, #4facfe 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.4)); }
        section { min-height: 100vh; display: flex; align-items: center; padding: 5% 10%; position: relative; border-bottom: 1px solid rgba(0, 242, 254, 0.05); background-size: cover; background-position: center; background-repeat: no-repeat; }
        .glass { background: rgba(5, 5, 10, 0.85); backdrop-filter: blur(30px); border: 1px solid rgba(0, 242, 254, 0.15); border-radius: 40px; padding: 3.5rem; width: 100%; position: relative; z-index: 10; }
        .scan-line { width: 100%; height: 3px; background: #00f3ff; position: absolute; top: 0; left: 0; animation: scan 3s cubic-bezier(0.4, 0, 0.2, 1) infinite; box-shadow: 0 0 20px #00f3ff; z-index: 20; opacity: 0.6; }
        @keyframes scan { 0% { top: 0%; opacity: 0; } 50% { opacity: 0.8; } 100% { top: 100%; opacity: 0; } }
        .glow-card { transition: all 0.4s ease; border: 1px solid rgba(255,255,255,0.05); background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px); }
        .glow-card:hover { border-color: #00f3ff; box-shadow: 0 0 30px rgba(0, 243, 255, 0.2); transform: translateY(-5px); }
        .photo-frame { width: 140px; height: 140px; border: 2px solid #00f3ff; border-radius: 30px; overflow: hidden; margin: 0 auto; box-shadow: 0 0 25px rgba(0, 243, 255, 0.3); }
    </style>
</head>

            Main Portal →
        </a>
